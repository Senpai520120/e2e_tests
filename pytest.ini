[pytest]
testpaths = tests
pythonpath = .
addopts =
    --base-url=http://127.0.0.1:8000
    --browser=chromium
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure
markers =
    p1: critical, smoke suite
    p2: regression
    p3: edge cases
    auth: authentication
    access: panel access control
    panel: user management panel
    files: file manager
    security: security checks