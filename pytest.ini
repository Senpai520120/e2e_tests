[pytest]
testpaths = tests
pythonpath = .

# Options added to every `pytest` run:
#   --base-url     address of the app; page.goto("/files/") goes to <base-url>/files/
#   --tracing, --screenshot, --video
#                  keep a trace, a screenshot and a video only for failed tests,
#                  in the test-results/ folder
#
# The browser is Chromium unless you choose others:
#   pytest --browser chromium --browser firefox --browser webkit
addopts =
    --base-url=http://127.0.0.1:8000
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure
